# ============================================================
# Cloudflare Workers 配置
# 使用前请先创建资源并替换占位符：
#   wrangler d1 create music-db      -> 得到 database_id（已填）
#   wrangler secret put JWT_SECRET   -> 设置 JWT 密钥（勿写进 [vars]）
# 存储：阿里云 OSS（S3 兼容，国内节点快，无需绑卡）
#   1. 注册阿里云并实名认证（手机号+身份证）
#   2. 创建 OSS 桶（Private），记录 OSS_BUCKET/OSS_REGION/OSS_ENDPOINT
#   3. 创建 AccessKey，用 secret 设置 OSS_ACCESS_KEY / OSS_SECRET_KEY
#   4. 桶的跨域设置(CORS)放行前端域名的 GET/PUT
# ============================================================
name = "music-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 关闭遥测上报（避免网络阻塞）
send_metrics = false

# D1 数据库（SQLite）
[[d1_databases]]
binding = "DB"
database_name = "music-db"
database_id = "980b11a8-851a-47e7-af1b-eb40f60fd801"

# 非敏感配置；JWT_SECRET/RESEND_API_KEY/OSS_ACCESS_KEY/OSS_SECRET_KEY
# 必须用 `wrangler secret put` 设置（[vars] 会覆盖同名远程 secret，切勿写在此处）
[vars]
JWT_EXPIRES = "604800"   # 7 天（秒）
EMAIL_FROM = "CloudMusic <onboarding@resend.dev>"

# --- 阿里云 OSS 存储 ---
OSS_BUCKET = "music-file-tgzjdv"
OSS_REGION = "cn-beijing"
OSS_ENDPOINT = "oss-cn-beijing.aliyuncs.com"
